{% extends "base.html" %}

{% block main_content %}
  {% import "../macros/trailCard.html" as trailCard %}
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <h1 style="color: red;">ADMIN VIEW</h1>
        {% for trail in trails %}
          {{ trailCard.trailCard(trail) }}
          <form method="get" action="/admin/trails/{{ trail.id }}/edit">
            <input type="submit" value="Edit Trail" />
          </form>
          <form method="post" action="/admin/trails/{{ trail.id }}/delete" style="margin-bottom: 50px;">
            <input type="submit" value="Delete Trail" />
          </form>
          <hr class="my-4" />
        {% endfor %}
      </div>
    </div>
  </div>
{% endblock main_content %}
